### Qwen2-VL 医学影像分割标注微调配置
### 适用于 LLaMA-Factory

### 模型配置
model_name_or_path: Qwen/Qwen2-VL-7B-Instruct
trust_remote_code: true

### 训练方法
stage: sft
do_train: true
finetuning_type: lora

### 数据集配置
dataset: medical_imaging_ct
dataset_dir: ./data
template: qwen2_vl
cutoff_len: 2048
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 16

### LoRA 配置
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

### 训练参数
output_dir: ./saves/qwen2_vl_medical_ct
logging_steps: 10
save_steps: 500
eval_steps: 500
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### 评估配置
val_size: 0.1
per_device_eval_batch_size: 2
eval_strategy: steps

### 多模态配置
image_resolution: 512
video_resolution: 128
video_fps: 2.0
video_maxlen: 64

