### Qwen2-VL 医学影像分割标注 - 推理配置
### 适用于 LLaMA-Factory

### 模型配置
model_name_or_path: Qwen/Qwen2-VL-7B-Instruct
adapter_name_or_path: ./saves/qwen2_vl_medical_ct
trust_remote_code: true
finetuning_type: lora

### 推理参数
template: qwen2_vl
infer_backend: huggingface

### 生成参数
temperature: 0.7
top_p: 0.9
top_k: 50
max_new_tokens: 512
repetition_penalty: 1.1

### 多模态配置
image_resolution: 512

