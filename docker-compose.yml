services:
  # PostgreSQL - 任务元数据存储
  postgres:
    image: postgres:16-alpine
    container_name: totalseg_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-totalseg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-totalseg_secret}
      POSTGRES_DB: ${POSTGRES_DB:-totalseg}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-totalseg}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO - 对象存储（CT/分割文件）
  minio:
    image: minio/minio:latest
    container_name: totalseg_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Redis - 缓存和任务队列（启用 AOF 持久化）
  redis:
    image: redis:7-alpine
    container_name: totalseg_redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend - 分割服务（GPU 算力侧）
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: totalseg-api:latest
    container_name: totalseg_api
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 28000
    environment:
      USE_DATABASE: ${USE_DATABASE:-true}
      DEBUG: ${DEBUG:-false}
      SEGMENTATION_WORKER_COUNT: ${SEGMENTATION_WORKER_COUNT:-1}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-totalseg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-totalseg_secret}
      POSTGRES_DB: ${POSTGRES_DB:-totalseg}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-totalseg-data}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_URL: http://minio:9000
    ports:
      - "${API_PORT:-28000}:28000"
    volumes:
      - ./api_data:/app/api_data
      - ./outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:28000/api/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]

  # Next.js Frontend - 平台子模块前端
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:28000}
    image: totalseg-web:latest
    container_name: totalseg_web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:28000}
      HOSTNAME: 0.0.0.0
      PORT: 23000
    ports:
      - "${WEB_PORT:-23000}:23000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:23000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Label Studio - 数据标注平台（可选）
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: totalseg_labelstudio
    ports:
      - "${LABEL_STUDIO_PORT:-10080}:8080"
    environment:
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/data
      # S3/MinIO 存储配置
      LABEL_STUDIO_FEATURE_FLAGS_ENABLE_CLOUD_STORAGE: "true"
      # 允许跨域访问
      LABEL_STUDIO_CROSS_ORIGIN_RESOURCE_POLICY: "cross-origin"
      # ML Backend 连接配置
      ML_BACKEND_URL: http://api:28000/ml
    volumes:
      - labelstudio_data:/label-studio/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - labelstudio  # 使用 --profile labelstudio 启用

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  labelstudio_data:
    driver: local

networks:
  default:
    name: totalseg_network
